version: "1"
agent:
  id: rebel-art
  name: Rebel Art Producer
  description: "Reval Rebel loop: Art / Asset Producer. Generates and prepares 2D
    sprites, 3D presentation assets, and audio briefs using ComfyUI / Leonardo.
    Model tier M + generation tools; 2-4 gen workers + 1 curator, batch
    overnight."
  kind: producer
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: all
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
