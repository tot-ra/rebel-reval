version: "1"
agent:
  id: rebel-art
  name: Rebel Art Producer
  emoji: "🎨"
  description: >-
    Delivers historically grounded, beautiful, readable, animated production art for the current playable slice and proactively maintains a bounded evidence-driven asset backlog.
  kind: producer
runtime:
  type: docker
  image: a2gent-rebel-art:blender-4.3
  lifecycle: warm
  resources:
    memory: 8g
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: allow
  enabled:
    - read
    - edit
    - write
    - grep
    - find_files
    - glob
    - bash
    - content_search
    - comfyui_generate_image
    - comfyui_run_workflow
    - leonardo_generate_image
  disabled: [delegate_to_agent, delegate_to_subagent, delegate_to_external_agent]
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: openai_codex
  model: gpt-5.6-sol
