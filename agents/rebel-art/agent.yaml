version: "1"
agent:
  id: rebel-art
  name: Rebel Art Producer
  description: Delivers historically grounded, beautiful, readable, animated
    production art for the current playable slice and proactively maintains a
    bounded evidence-driven asset backlog.
  kind: producer
runtime:
  type: docker
  image: a2gent-rebel-art:blender-4.3
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: all
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:mid-tier
