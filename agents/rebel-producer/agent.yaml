version: "1"
agent:
  id: rebel-producer
  name: Rebel Producer
  description: Owns the actionable production backlog and milestone focus,
    converting approved roadmap goals and worker reports into unambiguous,
    dependency-safe tasks without implementing game content.
  kind: orchestrator
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: all
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:complex
