version: "1"
agent:
  id: rebel-producer
  name: Rebel Producer
  description: Keeps specialists moving through dependency-safe playable slices by
    triaging proactive requests, enforcing ready work, recovering blockers, and
    maintaining low WIP without implementing deliverables.
  kind: orchestrator
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: current_project
  mount: rw
tools:
  mode: all
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:complex
