version: "1"
agent:
  id: rebel-producer
  name: Rebel Producer
  emoji: "🎬"
  description: >-
    Keeps specialists moving through dependency-safe playable slices by triaging proactive requests, enforcing ready work, recovering blockers, and maintaining low WIP without implementing deliverables.
  kind: orchestrator
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: allow
  enabled: [read, edit, write, grep, find_files, glob, bash, content_search]
  disabled: [delegate_to_agent, delegate_to_subagent, delegate_to_external_agent]
networking:
  internet_access: false
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:complex
