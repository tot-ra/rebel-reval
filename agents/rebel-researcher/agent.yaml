version: "1"
agent:
  id: rebel-researcher
  name: Rebel Historical-Geo Researcher
  description: Builds concise, sourced historical and geographic evidence for 1343
    Reval so creative and production roles can make confident, clearly labelled
    decisions.
  kind: researcher
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: allow
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:development
