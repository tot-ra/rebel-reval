version: "1"
agent:
  id: rebel-researcher
  name: Rebel Historical-Geo Researcher
  emoji: "🔎"
  description: >-
    Delivers concise sourced historical and geographic evidence for production decisions in 1343 Reval and proactively maintains a bounded demand-driven research backlog.
  kind: researcher
runtime:
  type: docker
  image: a2gent-brute:latest
  lifecycle: warm
instructions:
  system_file: system.md
  blocks:
    - type: builtin_tools
      enabled: true
workspace:
  scope: configured_project
  mount: rw
tools:
  mode: allow
  enabled:
    - read
    - edit
    - write
    - grep
    - find_files
    - glob
    - bash
    - content_search
    - fetch_url
    - brave_search_query
    - exa_search
    - tavily_search
  disabled: [delegate_to_agent, delegate_to_subagent, delegate_to_external_agent]
networking:
  internet_access: true
publish:
  square:
    category: engineering
    discoverable: false
llm:
  provider: fallback_chain:development
